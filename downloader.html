<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>EG 下载器</title><link rel="stylesheet" href="downloader.css"><body><h1>EG 下载器</h1><p>自动捕获访问网页时的文件、音频及视频直链。点击下载后开始任务。</p><form id="form"><input id="url" type="url" required placeholder="粘贴 HTTP / HTTPS 直链"><select id="threads"><option>4</option><option>8</option><option>2</option><option>1</option></select><button>分段下载</button></form><p>下载期间请保持本页打开。服务器不支持分段或文件超过 256 MB 时转交浏览器下载。</p><h2>下载任务</h2><div id="tasks"></div><p>打开网页即自动探索下载按钮、安装包链接和音视频资源；动态生成的地址在点击官网的下载按钮后捕获。页面发现的链接可能仍是下载介绍页。</p><button id="scan">重新扫描已打开的网页</button><span id="scan-status"></span><h2>捕获的直链 <button id="clear">清空</button></h2><div id="links"></div><script src="downloader.js"></script></body></html>
